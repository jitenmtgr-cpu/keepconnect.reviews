<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KeepConnect - Review Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { background-color: #6a4bc4; font-family: 'Segoe UI', Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: white; width: 92%; max-width: 420px; border-radius: 30px; padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.25); display: none; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .lang-dropdown { border: 1px solid #ddd; border-radius: 12px; padding: 8px; outline: none; background: #fff; cursor: pointer; font-weight: 600; color: #333; }
    .biz-name { color: #3498db; font-size: 26px; font-weight: bold; margin-bottom: 5px; }
    .location { color: #888; font-size: 14px; margin-bottom: 15px; }
    .review-card { border: 1px solid #f0f0f0; border-top: 4px solid #3498db; border-radius: 20px; padding: 25px; text-align: center; background: #fff; margin: 20px 0; }
    .stars { color: #f1c40f; margin-bottom: 10px; font-size: 18px; }
    .review-text { color: #444; font-size: 16px; line-height: 1.6; min-height: 80px; }
    .btn-container { display: flex; gap: 12px; }
    .btn { flex: 1; border: none; border-radius: 15px; padding: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; }
    .btn-change { background: #f1f4f9; color: #333; }
    .btn-copy { background: #1da1f2; color: white; }
    .loader { color: white; font-weight: bold; font-size: 18px; }
  </style>
</head>
<body>

<div id="loader" class="loader">माहिती लोड होत आहे, कृपया थांबा...</div>

<div class="card" id="mainCard">
  <div class="top-bar">
    <div style="background:#eef7ff; color:#3498db; font-weight:800; padding:6px 15px; border-radius:20px; font-size:11px;">KEEPCONNECT AI</div>
    <select id="langSelect" class="lang-dropdown" onchange="updateLang(this.value)"></select>
  </div>

  <div class="biz-name" id="bName">दुकान लोड होत आहे...</div>
  <div class="location" id="bLoc"></div>

  <div class="review-card">
    <div class="stars">★★★★★</div>
    <div id="reviewText" class="review-text">रिव्ह्यू लोड होत आहेत...</div>
  </div>

  <div class="btn-container">
    <button class="btn btn-change" onclick="getNewReview()"><i class="fa-solid fa-arrows-rotate"></i> बदला</button>
    <button class="btn btn-copy" onclick="copyAndGo()"><i class="fa-solid fa-paste"></i> कॉपी करा</button>
  </div>
</div>

<script>
  // --- तुमची CSV लिंक खाली टाका ---
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT1Ne6zMu836ZuBEaUEr3xAHs2fqZN57Q-eRDYP-WgZ4mIeDodjU1IiE-UBU6gqYm4awbnrjnf99uVD/pub?gid=0&single=true&output=csv"; 

  let allLanguagesData = {}; 
  let gmbLink = "";
  let currentLang = "English";
  let shuffledList = [];

  function init() {
    const params = new URLSearchParams(window.location.search);
    const targetId = params.get('id');

    Papa.parse(SHEET_CSV_URL, {
      download: true,
      header: false,
      complete: function(results) {
        const rows = results.data;
        const headers = rows[0]; 
        const row = rows.find(r => r[0] == targetId) || rows[1];

        if (row) {
          document.getElementById('bName').innerText = row[1];
          document.getElementById('bLoc').innerHTML = `<i class="fa-solid fa-location-dot"></i> ${row[2]}`;
          gmbLink = row[3]; 

          const select = document.getElementById('langSelect');
          select.innerHTML = ""; 

          // कॉलम F (Index 5) पासून सर्व भाषांचे कॉलम्स तपासणे
          for (let i = 5; i < headers.length; i++) {
            let langName = headers[i] ? headers[i].trim() : "";
            let langData = row[i] ? row[i].toString().trim() : "";

            // इंग्रजी, हिंदी नेहमी दाखवा किंवा ज्या भाषेच्या रकान्यात डेटा (;) आहे ती दाखवा
            if (langName === "English" || langName === "Hindi" || (langData !== "" && langData.includes(";"))) {
              allLanguagesData[langName] = langData.split(";").filter(s => s.trim() !== "");
              
              let opt = document.createElement("option");
              opt.value = langName;
              opt.innerText = langName;
              select.appendChild(opt);
            }
          }

          document.getElementById('loader').style.display = "none";
          document.getElementById('mainCard').style.display = "block";
          
          select.value = "English"; 
          updateLang("English");
        }
      }
    });
  }

  function updateLang(lang) {
    currentLang = lang;
    shuffledList = [...(allLanguagesData[lang] || [])].sort(() => Math.random() - 0.5);
    getNewReview();
  }

  function getNewReview() {
    if (shuffledList.length === 0) shuffledList = [...(allLanguagesData[currentLang] || [])].sort(() => Math.random() - 0.5);
    let review = shuffledList.pop() || "रिव्ह्यू सापडला नाही.";
    document.getElementById('reviewText').innerText = review.trim();
  }

  function copyAndGo() {
    const text = document.getElementById('reviewText').innerText;
    navigator.clipboard.writeText(text).then(() => { 
      window.location.href = gmbLink; 
    }).catch(() => {
      window.location.href = gmbLink;
    });
  }

  window.onload = init;
</script>
</body>
</html>
